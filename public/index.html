<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Purchase Chatbot</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <section class="chat-card">
      <header class="header">
        <div>
          <h1>Car Purchase Assistant</h1>
          <p>Amazon Lex V2 + AWS Lambda</p>
        </div>
        <span class="status">LOCAL</span>
      </header>

      <div id="messages" class="messages">
        <div class="message bot">
          <div class="bubble">Hello! I can help you place a car order. Say "I want to buy a car" to begin.</div>
        </div>
      </div>

      <div id="typing" class="typing hidden">Bot is thinking...</div>

      <form id="chat-form" class="input-row">
        <input
          id="message-input"
          type="text"
          placeholder="Type your message..."
          autocomplete="off"
          required
        />
        <button type="submit">Send</button>
      </form>

      <button id="new-session" class="new-session">Start New Conversation</button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
